<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laplacian Programmable Lab — Programmer’s Manual</title>
<style>
:root{--ink:#1d1d1f;--muted:#5f6368;--paper:#ffffff;--wash:#f6f5f2;--rule:#dedcd6;--accent:#d4561c;--accent2:#f7a440;--link:#1f5fa8;--code:#fbfaf7;--codeink:#20242a;--in:#9a3f12;--out:#5f6368;--head:#2b2b2e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
code,pre,.mono{font-family:"Source Code Pro",Menlo,Consolas,"DejaVu Sans Mono",monospace}
header.top{position:sticky;top:0;z-index:10;background:var(--head);color:#fff;display:flex;align-items:center;gap:18px;padding:0 22px;height:52px;box-shadow:0 1px 0 rgba(0,0,0,.2)}
header.top .logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;letter-spacing:.2px;white-space:nowrap}
header.top .logo .mark{width:26px;height:26px;border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font:700 13px/1 Georgia,serif;color:#fff}
header.top .logo small{font-weight:400;opacity:.7;margin-left:4px}
header.top nav{display:flex;gap:16px;font-size:14px}
header.top nav a{color:#e9e6df}
header.top .search{margin-left:auto;position:relative}
header.top input{width:280px;border:0;border-radius:4px;padding:7px 10px 7px 30px;font:14px inherit;background:#fff;color:var(--ink)}
header.top .search:before{content:"⌕";position:absolute;left:10px;top:4px;color:#777;font-size:17px}
#results{position:absolute;right:0;top:38px;width:420px;max-height:60vh;overflow:auto;background:#fff;color:var(--ink);border:1px solid var(--rule);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.18);display:none}
#results a{display:block;padding:7px 12px;border-bottom:1px solid #f0eee9;color:var(--ink)}#results a:hover,#results a.on{background:#fdf1e8;text-decoration:none}
#results b{font-family:"Source Code Pro",Menlo,monospace;color:var(--accent)}#results span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs{background:var(--wash);border-bottom:1px solid var(--rule);font-size:13px;color:var(--muted);padding:7px 22px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs .sep{opacity:.5}
.crumbs .right{margin-left:auto;display:flex;gap:14px}
main{max-width:1020px;margin:0 auto;padding:22px 28px 60px}
.reftype{display:flex;align-items:center;gap:12px;margin:6px 0 2px}
.tag{font:600 11px/1 "Source Sans 3",Arial,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:4px 7px;border-radius:3px}
.tag.snip{color:#7a4bb0;border-color:#7a4bb0}.tag.api{color:#1f7a58;border-color:#1f7a58}.tag.val{color:#1f5fa8;border-color:#1f5fa8}
h1.sym{font:600 38px/1.15 "Source Code Pro",Menlo,monospace;margin:8px 0 14px;color:#111;word-break:break-all}
.usage{border-top:2px solid var(--accent);border-bottom:1px solid var(--rule);margin:0 0 18px}
.usage .row{display:grid;grid-template-columns:minmax(220px,auto) 1fr;gap:22px;padding:13px 4px;border-bottom:1px solid #eeece7}
.usage .row:last-child{border-bottom:0}
.usage .tpl{font-family:"Source Code Pro",Menlo,monospace;font-size:15px;white-space:nowrap}
.usage .tpl b{font-weight:700}.usage .tpl i{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:16px;color:#333}
.usage .txt{color:#333}
details.sec{border-top:1px solid var(--rule);margin:0}
details.sec>summary{list-style:none;cursor:pointer;padding:12px 4px;font:600 19px/1.3 "Source Sans 3",Arial,sans-serif;color:#222;display:flex;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:before{content:"";width:0;height:0;border-left:7px solid var(--accent);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
details.sec[open]>summary:before{transform:rotate(90deg)}
details.sec>summary .n{font-weight:400;color:var(--muted);font-size:15px}
.detail-list{margin:0 0 16px 22px;padding:0}
.detail-list li{margin:7px 0;padding-left:6px}
details.sub{margin:0 0 6px 18px}
details.sub>summary{list-style:none;cursor:pointer;padding:8px 0;font:600 16px "Source Sans 3",Arial,sans-serif;color:#333;display:flex;gap:9px;align-items:center}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary:before{content:"";border-left:6px solid #999;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details.sub[open]>summary:before{transform:rotate(90deg)}
details.sub>summary .n{font-weight:400;color:var(--muted);font-size:14px}
.cell{display:grid;grid-template-columns:76px 1fr;gap:0 10px;margin:6px 0 14px 4px}
.cell .lab{font:italic 12.5px/1.9 Georgia,serif;color:var(--in);text-align:right;padding-top:6px;white-space:nowrap}
.cell .lab.o{color:var(--out)}
.cell pre{margin:0;padding:8px 12px;background:var(--code);border:1px solid #ecebe6;border-radius:4px;font-size:13.6px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--codeink);position:relative}
.cell pre.in{border-left:3px solid var(--accent2)}
.cell pre.out{background:#fff;border-color:#f0efea}
.cell .img{padding:6px 0}.cell .img img{max-width:100%;border:1px solid #f0efea;border-radius:4px;background:#fff}
.copy{position:absolute;right:6px;top:5px;font:11px "Source Sans 3",Arial;background:#fff;border:1px solid var(--rule);color:var(--muted);border-radius:3px;padding:1px 7px;cursor:pointer;opacity:0;transition:opacity .15s}
pre:hover .copy{opacity:1}
pre .fn{color:var(--link);font-weight:600}pre .str{color:#1d7a4a}pre .cmt{color:#8a8a8a;font-style:italic}pre .num{color:#7a3fb0}
.src pre{margin:4px 0 16px;padding:12px 14px;background:#2a2b2f;color:#eee9df;border-radius:5px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.src pre .fn{color:#ffb36b}.src pre .str{color:#a8d98a}.src pre .cmt{color:#9a9a9a}.src pre .num{color:#d4b3ff}
.src .note{font-size:13px;color:var(--muted);margin:0 0 4px}
.hand-steps{margin:2px 0 18px 4px;padding:12px 18px 12px 40px;background:#fff8f1;border:1px solid #f3dcc6;border-left:4px solid var(--accent2);border-radius:6px;counter-reset:none}
.hand-steps li{margin:7px 0;padding-left:4px;font-size:15px;line-height:1.6}
.hand-steps li::marker{color:var(--accent);font-weight:600}
.outref{font:italic 13px Georgia,serif;color:var(--in);white-space:nowrap}
.see{display:flex;flex-wrap:wrap;gap:6px 18px;margin:4px 0 18px 4px;font-family:"Source Code Pro",Menlo,monospace;font-size:14px}
.see a:after{content:"";}
.hist{margin:4px 0 18px 4px;color:#444}
.guides{margin:4px 0 18px 4px}
footer{border-top:1px solid var(--rule);margin-top:34px;padding-top:14px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
/* home & guide */
.hero{background:linear-gradient(120deg,#2b2b2e 0%,#3a3530 60%,#5a3a22 100%);color:#fff;border-radius:8px;padding:30px 32px;margin:0 0 26px}
.hero h1{margin:0 0 6px;font:600 30px/1.2 "Source Sans 3",Arial,sans-serif}
.hero p{margin:0;opacity:.85;max-width:720px}
.hero .meta{margin-top:14px;font-size:13px;opacity:.75}
.hero .meta a{color:#ffd2a8}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.tile{border:1px solid var(--rule);border-radius:7px;padding:16px 18px;background:#fff;transition:box-shadow .15s,border-color .15s;display:block;color:var(--ink)}
.tile:hover{border-color:var(--accent2);box-shadow:0 4px 16px rgba(212,86,28,.12);text-decoration:none}
.tile h3{margin:0 0 6px;font-size:17px;color:#222}
.tile p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.tile .fns{font:12.5px/1.6 "Source Code Pro",Menlo,monospace;color:var(--link)}
.gtitle{font:600 32px/1.2 "Source Sans 3",Arial,sans-serif;margin:8px 0 8px}
.gdesc{color:#333;max-width:820px;margin:0 0 18px}
.glist{border-top:2px solid var(--accent)}
.glist .r{display:grid;grid-template-columns:230px 1fr;gap:18px;padding:9px 4px;border-bottom:1px solid #eeece7}
.glist .r a{font-family:"Source Code Pro",Menlo,monospace;font-weight:600}
.glist .r span{color:#444;font-size:14px}
.idx h2{font:600 20px "Source Sans 3",Arial;border-bottom:1px solid var(--rule);margin:22px 0 8px;padding-bottom:4px;color:var(--accent)}
.idx .cols{columns:3 240px;column-gap:28px}
.idx .cols a{display:block;font-family:"Source Code Pro",Menlo,monospace;font-size:14px;padding:2px 0;break-inside:avoid}
.idx .cols a small{font-family:"Source Sans 3",Arial;color:var(--muted);font-size:12px;margin-left:6px}
.stats{display:flex;gap:26px;margin:0 0 22px;color:var(--muted);font-size:13.5px}
.stats b{display:block;font-size:24px;color:var(--ink)}
/* CCN: always-visible scrollbars (macOS/iPadOS hide overlay scrollbars) + tab-strip arrows */::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-track{background:rgba(127,127,127,.12);border-radius:8px}::-webkit-scrollbar-thumb{background:rgba(127,127,127,.55);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:rgba(212,86,28,.75);background-clip:padding-box}*{scrollbar-width:auto;scrollbar-color:rgba(127,127,127,.6) rgba(127,127,127,.12)}.hs-wrap{position:relative;display:flex;align-items:stretch;min-width:0}.hs-wrap>.hs-strip{flex:1 1 auto;min-width:0}.hs-btn{flex:none;width:30px;border:1px solid rgba(127,127,127,.35);background:inherit;color:inherit;font:600 18px/1 system-ui,sans-serif;cursor:pointer;border-radius:6px;margin:2px 3px 10px;opacity:.85}.hs-btn:hover{opacity:1;border-color:#d4561c;color:#d4561c}.hs-btn[disabled]{opacity:.25;cursor:default}.hs-wrap:not(.hs-over)>.hs-btn{display:none}.hs-wrap:not(.hs-over){display:contents}.hs-bar{position:relative;height:12px;margin:3px 0 6px;border-radius:6px;background:rgba(127,127,127,.16);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}.hs-bar[hidden]{display:none!important}.hs-thumb{position:absolute;top:2px;bottom:2px;left:0;min-width:28px;border-radius:5px;background:rgba(127,127,127,.6);cursor:grab}.hs-thumb:hover,.hs-bar.drag .hs-thumb{background:#d4561c}.hs-bar.drag .hs-thumb{cursor:grabbing}.hs-nonative{scrollbar-width:none}.hs-nonative::-webkit-scrollbar{height:0;display:none}
@media (max-width:720px){header.top input{width:150px}header.top nav{display:none}.usage .row,.glist .r{grid-template-columns:1fr;gap:4px}.cell{grid-template-columns:1fr}.cell .lab{text-align:left;padding:0}#results{width:300px}h1.sym{font-size:28px}}
@media print{header.top,.crumbs .right,.copy{display:none}details.sec,details.sub{display:block}}
</style>
</head>

nter."]], "details": ["Typed \\[ScriptA]\\[ScriptR]\\[ScriptG]\\[ScriptS]; the third letter is script g ℊ (U+210A). The look-alike 𝒶𝓇𝓈 is a different, undefined symbol.", "A bare symbol f is read as f @@ 𝒶𝓇ℊ𝓈 by lapToExpr."], "examples": {"Basic Examples": [{"in": "𝒶𝓇ℊ𝓈", "out": "{x, y, z}"}], "Scope": [{"in": "𝒶𝓇ℊ𝓈 = {x, y, z, t}; Δ[f]", "out": "Derivative[0, 0, 0, 2][f][x, y, z, t] + Derivative[0, 0, 2, 0][f][x, y, z, t] + Derivative[0, 2, 0, 0][f][x, y, z, t] + Derivative[2, 0, 0, 0][f][x, y, z, t]"}, {"in": "𝒶𝓇ℊ𝓈 = {x, y}; Δ[x^3 y^3]", "out": "6*x^3*y + 6*x*y^3"}]}, "see": ["𝒹", "𝒞enter", "lapToExpr"], "source": "𝒶𝓇ℊ𝓈 = {x, y, z};   (* typed as \\[ScriptA]\\[ScriptR]\\[ScriptG]\\[ScriptS] *)", "hand": ["With 𝒶𝓇ℊ𝓈 = {x, y, z, t}, a bare f means f[x, y, z, t], and Δ adds one unrepeated second derivative per variable.", "Δf = f_{xx} + f_{yy} + f_{zz} + f_{tt}: four terms — Out[2].", "With 𝒶𝓇ℊ𝓈 = {x, y}: Δ(x³y³) = 6xy³ + 6x³y — Out[3]."]}, "𝒹": {"name": "𝒹", "slug": "d", "guide": "delta", "defined": "Lab page: Wolfram cell prelude (WL_PRELUDE)", "kind": "Symbol", "usage": [["𝒹", "gives the dimension Length[𝒶𝓇ℊ𝓈]."]], "details": ["Defined with SetDelayed, so it follows changes of 𝒶𝓇ℊ𝓈."], "examples": {"Basic Examples": [{"in": "𝒹", "out": "3"}], "Scope": [{"in": "𝒶𝓇ℊ𝓈 = {x, y, z, t, u}; 𝒹", "out": "5"}]}, "see": ["𝒶𝓇ℊ𝓈", "𝒞enter"], "source": "𝒹 := Length[𝒶𝓇ℊ𝓈];", "hand": ["𝒹 is Length[𝒶𝓇ℊ𝓈]: {x, y, z} has 3 entries — Out[1].", "After 𝒶𝓇ℊ𝓈 = {x, y, z, t, u}: 5 — Out[2]."]}, "𝒞enter": {"name": "𝒞enter", "slug": "Center", "guide": "delta", "defined": "Lab page: Wolfram cell prelude (WL_PRELUDE)", "kind": "Symbol", "usage": [["𝒞enter", "gives the centre point {x0, y0, z0}: each variable of 𝒶𝓇ℊ𝓈 with 0 appended."]], "details": ["Matches the centre used by laplacianSteps."], "examples": {"Basic Examples": [{"in": "𝒞enter", "out": "{x0, y0, z0}"}], "Scope": [{"in": "Δ[x^2 y + z^3] /. Thread[𝒶𝓇ℊ𝓈 -> 𝒞enter]", "out": "2*y0 + 6*z0"}]}, "see": ["𝒶𝓇ℊ𝓈", "laplacianSteps"], "source": "𝒞enter := Symbol[ToString[#] <> \"0\"] & /@ 𝒶𝓇ℊ𝓈;", "hand": ["Append “0” to each variable name: x → x0, y → y0, z → z0 — Out[1].", "Δ(x²y + z³) = 2y + 6z; at the centre 2y0 + 6z0 — Out[2]."]}, "ℋelp": {"name": "ℋelp", "slug": "Help", "guide": "delta", "defined": "Lab page: Wolfram cell prelude (WL_PRELUDE)", "kind": "Symbol", "usage": [["ℋelp", "gives a short summary of the Δ notation: the dimension, the variables, the centre and the two operator forms."]], "details": [], "examples": {"Basic Examples": [{"in": "ℋelp", "out": "{\"𝒹\" -> 3, \"𝒶𝓇ℊ𝓈\" -> {x, y, z}, \"𝒞enter\" -> {x0, y0, z0}, \"Δ\" -> \"Δ[n][expr]\", \"𝜟\" -> \"𝜟⊗expr\"}"}]}, "see": ["Δ", "𝜟", "𝒶𝓇ℊ𝓈"], "source": "ℋelp := {\"𝒹\" -> 𝒹, \"𝒶𝓇ℊ𝓈\" -> 𝒶𝓇ℊ𝓈, \"𝒞enter\" -> 𝒞enter, \"Δ\" -> \"Δ[n][expr]\", \"𝜟\" -> \"𝜟⊗expr\"};", "hand": ["ℋelp just collects 𝒹 = 3, 𝒶𝓇ℊ𝓈 = {x, y, z}, 𝒞enter = {x0, y0, z0} and the two operator templates — Out[1]."]}, "lapToExpr": {"name": "lapToExpr", "slug": "lapToExpr", "guide": "delta", "defined": "Lab page: Wolfram cell prelude (WL_PRELUDE)", "kind": "Function", "usage": [["lapToExpr[f]", "gives f @@ 𝒶𝓇ℊ𝓈 when f is a symbol with no values, so that a bare f means f[x, y, z]."], ["lapToExpr[expr]", "gives expr unchanged for anything else."]], "details": ["A symbol that already has a definition, such as h[x_, y_, z_] := …, is left as it is."], "examples": {"Basic Examples": [{"in": "lapToExpr[f]", "out": "f[x, y, z]"}, {"in": "lapToExpr[x^2 + y]", "out": "x^2 + y"}], "Possible Issues": [{"in": "h[x_, y_, z_] := x^2 y z; {lapToExpr[h], Δ[h], Δ[h[x, y, z]]}", "out": "{h, 0, 2*y*z}"}]}, "see": ["lapN", "Δ", "𝒶𝓇ℊ𝓈"], "source": "lapToExpr[g_Symbol] := If[OwnValues[g] === {} && DownValues[g] === {}, g @@ 𝒶𝓇ℊ𝓈, g];\nlapToExpr[g_] := g;", "hand": ["f has no definitions, so lapToExpr[f] = f @@ 𝒶𝓇ℊ𝓈 = f[x, y, z] — Out[1]. An expression such as x² + y is returned unchanged — Out[2].", "h[x_, y_, z_] := x² y z gives h DownValues, so lapToExpr[h] stays the bare symbol h, and Δ[h] differentiates a constant: 0.", "Δ[h[x, y, z]] = Δ(x²yz) = 2yz. Together {h, 0, 2yz} — Out[3]."]}, "lapN": {"name": "lapN", "slug": "lapN", "guide": "delta", "defined": "Lab page: Wolfram cell prelude (WL_PRELUDE)", "kind": "Function", "usage": [["lapN[f, n]", "gives the n-th power of the Laplacian in the variables 𝒶𝓇ℊ𝓈 applied to f."]], "details": ["f goes through lapToExpr first; n is a non-negative integer.", "Δ[n][f], Δ[f] and 𝜟⊗…⊗f all call lapN."], "examples": {"Basic Examples": [{"in": "lapN[f, 1]", "out": "Derivative[0, 0, 2][f][x, y, z] + Derivative[0, 2, 0][f][x, y, z] + Derivative[2, 0, 0][f][x, y, z]"}, {"in": "lapN[x^4 + y^2 z^2, 2]", "out": "32"}], "Properties & Relations": [{"in": "lapN[f, 0]", "out": "f[x, y, z]"}, {"in": "Simplify[lapN[f, 2] - Laplacian[Laplacian[f[x, y, z], {x, y, z}], {x, y, z}]]", "out": "0"}]}, "see": ["Δ", "CircleTimes", "lapToExpr"], "source": "lapN[g_, n_Integer?NonNegative] := Nest[Laplacian[#, 𝒶𝓇ℊ𝓈] &, lapToExpr[g], n];", "hand": ["lapN[f, 1] is one Laplacian of f[x, y, z]: f_{xx} + f_{yy} + f_{zz} — Out[1].", "Δ(x⁴ + y²z²) = 12x² + 2z² + 2y²; Δ again: 24 + 4 + 4 = 32 — Out[2].", "lapN[f, 0] applies no Laplacian: f[x, y, z] — Out[3]."]}, "Δ": {"name": "Δ", "slug": "Delta", "guide": "delta", "defined": "Lab page: Wolfram cell prelude (WL_PRELUDE)", "kind": "Function", "usage": [["Δ[f]", "gives the Laplacian of f in the variables 𝒶𝓇ℊ𝓈."], ["Δ[n][f]", "gives the n-th power Δⁿf."]], "details": ["On the Lab page Δf, Δ²f, Δ(2)f, Δ^2 f, Δ2f and ∇²f are rewritten to Δ[1]@f or Δ[2]@f before the code is sent.", "In outputs the page shows Derivative[a, b, c][f] as f^(a,b,c)."], "examples": {"Basic Examples": [{"in": "Δ[f]", "out": "Derivative[0, 0, 2][f][x, y, z] + Derivative[0, 2, 0][f][x, y, z] + Derivative[2, 0, 0][f][x, y, z]"}, {"in": "Δ[2][x^2 y^2 z^2]", "out": "8*x^2 + 8*y^2 + 8*z^2"}], "Scope": [{"in": "Δ[1/Sqrt[x^2 + y^2 + z^2]] // Simplify", "out": "0"}], "Properties & Relations": [{"in": "Δ[2][f] - Δ[Δ[f]]", "out": "0"}], "Possible Issues": [{"in": "Δ[3]", "out": "Δ[3]"}]}, "see": ["lapN", "𝜟", "CircleTimes", "laplacianSteps"], "source": "Δ[n_Integer?NonNegative][g_] := lapN[g, n];\nΔ[g_] /; ! IntegerQ[g] := lapN[g, 1];", "hand": ["Δ[f] = f_{xx} + f_{yy} + f_{zz} — Out[1].", "Δ(x²y²z²) = 2y²z² + 2x²z² + 2x²y²; Δ again: (4z² + 4y²) + (4z² + 4x²) + (4y² + 4x²) = 8x² + 8y² + 8z² — Out[2].", "For r = |X| in ℝ³, Δ rᵖ = p(p + 1) rᵖ⁻²; p = −1 gives 0, so 1/r is harmonic — Out[3]."]}, "𝜟": {"name": "𝜟", "slug": "ItalicDelta", "guide": "delta", "defined": "Lab page: Wolfram cell prelude (WL_PRELUDE)", "kind": "Symbol", "usage": [["𝜟", "is the operator symbol of the tensor notation; it evaluates to the inert symbol lapOp."], ["𝜟⊗f", "gives Δf; 𝜟⊗𝜟⊗f gives Δ²f."]], "details": ["Typed \\|01d71f (mathematical italic capital delta), distinct from Δ.", "The products are handled by the CircleTimes rule."], "examples": {"Basic Examples": [{"in": "𝜟", "out": "lapOp"}, {"in": "𝜟⊗f", "out": "Derivative[0, 0, 2][f][x, y, z] + Derivative[0, 2, 0][f][x, y, z] + Derivative[2, 0, 0][f][x, y, z]"}]}, "see": ["CircleTimes", "Δ"], "source": "𝜟 = lapOp;   (* typed as \\|01d71f *)", "hand": ["𝜟 evaluates to the inert symbol lapOp — Out[1].", "𝜟⊗f is CircleTimes[lapOp, f], which the extension rule turns into lapN[f, 1] = f_{xx} + f_{yy} + f_{zz} — Out[2]."]}, "CircleTimes": {"name": "CircleTimes", "slug": "CircleTimes", "guide": "delta", "defined": "Lab page: Wolfram cell prelude (WL_PRELUDE)", "kind": "Function (extension)", "usage": [["𝜟⊗…⊗𝜟⊗f", "with k copies of 𝜟 gives lapN[f, k]."]], "details": ["CCN extension of the built-in CircleTimes: one rule for lapOp factors, other uses of ⊗ are untouched."], "examples": {"Basic Examples": [{"in": "𝜟⊗𝜟⊗f - Δ[2][f]", "out": "0"}, {"in": "𝜟⊗(x^2 + y^2 + z^2)^2", "out": "8*x^2 + 8*y^2 + 8*z^2 + 12*(x^2 + y^2 + z^2)"}], "Possible Issues": [{"in": "a⊗b", "out": "a ⊗ b"}]}, "see": ["𝜟", "lapN"], "source": "Unprotect[CircleTimes]; CircleTimes[ops : lapOp .., g_] := lapN[g, Length[{ops}]]; Protect[CircleTimes];", "hand": ["𝜟⊗𝜟⊗f has two lapOp factors, so it is lapN[f, 2] = Δ[2][f]; the difference is 0 — Out[1].", "𝜟⊗(x² + y² + z²)² = Δ r⁴ = 4 · 5 · r² = 20r², which Laplacian writes as 8x² + 8y² + 8z² + 12(x² + y² + z²) — Out[2].", "a⊗b has no lapOp factor, so the rule does not fire: a ⊗ b — Out[3]."]}, "sphere": {"name": "sphere", "slug": "sphere", "guide": "means", "defined": "Lab snippet: Theorem 5.4", "kind": "Function", "usage": [["sphere[d, k]", "gives the coefficient of r^{2k} Δᵏf in the mean of f over the sphere of radius r in ℝᵈ: 1/(2ᵏ k! d(d + 2)…(d + 2k − 2))."]], "details": [], "examples": {"Basic Examples": [{"in": "Table[sphere[3, k], {k, 0, 4}]", "out": "{1, 1/6, 1/120, 1/5040, 1/362880}"}], "Properties & Relations": [{"in": "Simplify[sphere[d, 1] == 1/(2 d)]", "out": "True"}]}, "see": ["ball", "laplacianSteps"], "source": "sphere[d_, k_] := 1/(2^k k! Product[d + 2 j, {j, 0, k - 1}]);", "hand": ["sphere[d, k] = 1/(2ᵏ k! d(d + 2)…(d + 2k − 2)).", "d = 3: k = 1 → 1/(2 · 3) = 1/6; k = 2 → 1/(4 · 2 · 3 · 5) = 1/120; k = 3 → 1/(8 · 6 · 3 · 5 · 7) = 1/5040.", "{1, 1/6, 1/120, 1/5040, 1/362880} — Out[1]: the series of sinh r/r, the sphere mean of e^{x}."]}, "ball": {"name": "ball", "slug": "ball", "guide": "means", "defined": "Lab snippet: Theorem 5.4", "kind": "Function", "usage": [["ball[d, k]", "gives the coefficient of r^{2k} Δᵏf in the mean of f over the ball of radius r in ℝᵈ: 1/(2ᵏ k! (d + 2)(d + 4)…(d + 2k))."]], "details": [], "examples": {"Basic Examples": [{"in": "Table[ball[3, k], {k, 0, 4}]", "out": "{1, 1/10, 1/280, 1/15120, 1/1330560}"}], "Properties & Relations": [{"in": "Simplify[ball[d, 1] == 1/(2 (d + 2))]", "out": "True"}, {"in": "Union@Flatten@Table[ball[d, k] == sphere[d + 2, k], {d, 1, 6}, {k, 0, 4}]", "out": "{True}"}]}, "see": ["sphere", "laplacianSteps"], "source": "ball[d_, k_] := 1/(2^k k! Product[d + 2 j, {j, 1, k}]);", "hand": ["ball[d, k] = 1/(2ᵏ k! (d + 2)(d + 4)…(d + 2k)).", "d = 3: k = 1 → 1/(2 · 5) = 1/10; k = 2 → 1/(4 · 2 · 5 · 7) = 1/280.", "{1, 1/10, 1/280, 1/15120, 1/1330560} — Out[1]. Shifting d by 2 turns the ball product into the sphere product, so ball[d, k] = sphere[d + 2, k] — Out[3]."]}, "g": {"name": "g", "slug": "g", "guide": "means", "defined": "Lab snippet: §7.5.1 check", "kind": "Function", "usage": [["g[x, y, z]", "gives the field 1/r³ = (x² + y² + z²)^(−3/2) used in the §7.5.1 normalisation check."]], "details": ["Its Laplacian is 6/r⁵, so the sphere-mean limit with the Theorem 3.1 normalisation is finite."], "examples": {"Basic Examples": [{"in": "g[1, 1, 1]", "out": "1/(3*Sqrt[3])"}], "Properties & Relations": [{"in": "Simplify[Laplacian[g[x, y, z], {x, y, z}]]", "out": "6/(x^2 + y^2 + z^2)^(5/2)"}]}, "see": ["sphere", "Δ"], "source": "g[x_, y_, z_] := (x^2 + y^2 + z^2)^(-3/2);", "hand": ["g(1, 1, 1) = (1 + 1 + 1)^{−3/2} = 3^{−3/2} = 1/(3√3) — Out[1].", "With r = |X|, Δ rᵖ = p(p + 1) rᵖ⁻². For p = −3: (−3)(−2) r⁻⁵ = 6/r⁵ — Out[2]."]}, "laplacianSteps": {"name": "laplacianSteps", "slug": "laplacianSteps", "guide": "means", "defined": "Laplacian Lab notebook code (staged derivation)", "kind": "Function", "usage": [["laplacianSteps[]", "derives Δf at a point from the mean of f over a small sphere in ℝ³, with Taylor order 2, and returns every stage with its checks."], ["laplacianSteps[d, n]", "works in dimension d ≤ 7 with Taylor order n in each variable."], ["laplacianSteps[d, n, \"Region\" -> \"Ball\"]", "uses the ball mean instead of the sphere mean."]], "details": ["Stages: Taylor polynomial, measure, vanishing of odd multi-indices, mean by powers of r, the r² coefficient against Δf/(2d) (sphere) or Δf/(2(d + 2)) (ball), and the limit of the scaled difference.", "n = 2 is enough for the r² coefficient and the limit; the r⁴ coefficient needs n ≥ 4.", "Option \"Function\" (default f) names the function being averaged."], "examples": {"Basic Examples": [{"in": "Select[laplacianSteps[], BooleanQ]", "out": "<|\"5 check: r^2 coefficient == Δf/6\" -> True, \"6 check: limit == Δf at centre\" -> True|>"}, {"in": "laplacianSteps[][\"6 limit r -> 0\"]", "out": "Derivative[0, 0, 2][f][x0, y0, z0] + Derivative[0, 2, 0][f][x0, y0, z0] + Derivative[2, 0, 0][f][x0, y0, z0]"}], "Scope": [{"in": "Select[laplacianSteps[2, 2, \"Region\" -> \"Ball\"], BooleanQ]", "out": "<|\"5 check: r^2 coefficient == Δf/8\" -> True, \"6 check: limit == Δf at centre\" -> True|>"}, {"in": "laplacianSteps[2, 2][\"2 measure\"]", "out": "2*Pi*r"}], "Options": [{"in": "laplacianSteps[2, 2, \"Function\" -> u][\"6 limit r -> 0\"]", "out": "Derivative[0, 2][u][x0, y0] + Derivative[2, 0][u][x0, y0]"}], "Properties & Relations": [{"in": "laplacianSteps[3, 2][\"3 odd multi-indices: left after integrating\"]", "out": "0"}]}, "see": ["laplacianStepsColumn", "sphere", "ball", "Δ"], "source": "ClearAll[laplacianSteps, laplacianStepsColumn];\nOptions[laplacianSteps] = {\"Region\" -> \"Sphere\", \"Function\" -> f};\nlaplacianSteps[d : (_Integer?Positive) : 3, n : (_Integer?Positive) : 2, OptionsPattern[]] /; d <= 7 := Module[\n  {fn = OptionValue[\"Function\"], ball = OptionValue[\"Region\"] === \"Ball\", vars, ctr, f0, series, measure,\n   integral, mean, idx, oddIdx, byPower, c2, lap0, factor, scaled, lim},\n  vars = Take[{x, y, z, t, u, v, w}, d];\n  ctr = Symbol[ToString[#] <> \"0\"] & /@ vars;\n  f0 = fn @@ ctr;\n  series = Normal@Series[fn @@ vars, Sequence @@ Transpose[{vars, ctr, ConstantArray[n, d]}]];\n  measure = If[ball, Pi^(d/2)/Gamma[d/2 + 1] r^d, 2 Pi^(d/2)/Gamma[d/2] r^(d - 1)];\n  integral = If[ball,\n    Integrate[series, vars ∈ Ball[ctr, r], Assumptions -> r > 0],\n    SurfaceIntegrate[series, vars ∈ Sphere[ctr, r], Assumptions -> r > 0]];\n  mean = Expand[integral/measure];\n  idx[e_] := Union@Cases[e, Derivative[k__][fn][__] :> {k}, Infinity];\n  oddIdx = Select[idx[series], AnyTrue[#, OddQ] &];\n  byPower = DeleteCases[Table[k -> Simplify@Coefficient[mean, r, k], {k, 0, d n}], _ -> 0];\n  c2 = Simplify@Coefficient[mean, r, 2];\n  lap0 = Laplacian[fn @@ vars, vars] /. Thread[vars -> ctr];\n  factor = If[ball, 2 (d + 2), 2 d];\n  scaled = Expand[factor (mean - f0)/r^2];\n  lim = Quiet@Limit[scaled, r -> 0];\n  <|\n   \"region\" -> If[ball, \"ball\", \"sphere\"],\n   \"dimension\" -> d,\n   \"Taylor order per variable\" -> n,\n   \"1 Taylor polynomial: terms\" -> 1 + Length[idx[series]],\n   \"2 measure\" -> measure,\n   \"3 odd multi-indices: in series\" -> Length[oddIdx],\n   \"3 odd multi-indices: left after integrating\" -> Length[Intersection[oddIdx, idx[mean]]],\n   \"4 mean by powers of r\" -> byPower,\n   \"4 note\" -> If[n < 4,\n     \"coefficients of r^4 and higher are incomplete at this Taylor order; use n >= 4 for them\",\n     \"coefficients up to r^4 are complete\"],\n   \"5 r^2 coefficient\" -> c2,\n   \"5 check: r^2 coefficient == Δf/\" <> ToString[factor] -> Simplify[c2 == lap0/factor],\n   \"6 factor\" -> factor/r^2,\n   \"6 \" <> ToString[factor] <> \"(mean - f0)/r^2\" -> scaled,\n   \"6 limit r -> 0\" -> lim,\n   \"6 check: limit == Δf at centre\" -> Simplify[lim == lap0]\n   |>];", "hand": ["Taylor-expand f to order 2 at the centre and average over the sphere of radius r in ℝ³. Odd monomials average to 0 (Out[6] counts 0 left).", "The mean of (x − x0)² over the sphere is r²/3, and the same for y, z; mixed terms vanish. So mean = f0 + (r²/3)(½)(f_{xx} + f_{yy} + f_{zz}) = f0 + r²Δf/6.", "Hence 6(mean − f0)/r² → Δf at the centre: both checks are True — Out[1], and the limit is f^{(0,0,2)} + f^{(0,2,0)} + f^{(2,0,0)} — Out[2].", "In the plane the circle has length 2πr — Out[4]; the ball factor is 2(d + 2) = 8 — Out[3]."]}, "laplacianStepsColumn": {"name": "laplacianStepsColumn", "slug": "laplacianStepsColumn", "guide": "means", "defined": "Laplacian Lab notebook code (staged derivation)", "kind": "Function", "usage": [["laplacianStepsColumn[steps]", "typesets the Association returned by laplacianSteps as a column of labelled stages in TraditionalForm."]], "details": [], "examples": { slug": "LaplacianLabKernel", "guide": "kernel", "defined": "Wolfram Cloud deployment (CCN account)", "kind": "API Function", "usage": [["POST https://www.wolframcloud.com/obj/ccn2/LaplacianLabKernel", "with form fields key, code_b64 (or code) and mode = \"wolfram\" evaluates the code and returns JSON {text, text_b64, image, chat_ready}."], ["… mode = \"chat\", payload_b64", "sends the JSON payload (model, max_tokens, system, messages) to the chat service with the key stored privately in the cloud, and returns {text_b64, stop_reason} or {error, status}."]], "details": ["A deployed APIFunction with public permissions, gated by a deploy secret: requests whose key differs get Failure[\"Forbidden\"].", "The chat key is read with CloudGet from the private object LaplacianLab/apikey and is never returned.", "Text travels as base64 of UTF-8 so that Δ, 𝜟 and θ survive the JSON format.", "Graphics results come back as a base64 PNG in image, and as \"-Graphics-\" in text.", "The examples call kernelAPI, a local, undeployed copy of the same APIFunction built with the demo secret \"demo-secret\"; it has no chat key, so chat_ready is False."], "examples": {"Basic Examples": [{"in": "kernelAPI[<|\"key\" -> \"demo-secret\", \"code\" -> \"Expand[(x + y)^3]\"|>]", "out": "<|\"text\" -> \"x^3 + 3*x^2*y + 3*x*y^2 + y^3\", \"text_b64\" -> \"eF4zICsgMyp4XjIqeSArIDMqeCp5XjIgKyB5XjM=\", \"image\" -> \"\", \"chat_ready\" -> False|>"}], "Scope": [{"in": "kernelAPI[<|\"key\" -> \"demo-secret\", \"code_b64\" -> b64s[\"Laplacian[x^2 y^2, {x, y}]\"]|>][\"text\"]", "out": "\"2*x^2 + 2*y^2\""}, {"in": "kernelAPI[<|\"key\" -> \"demo-secret\", \"code\" -> \"Plot[Sin[x], {x, 0, 6}]\"|>][\"text\"]", "out": "\"\\\"-Graphics-\\\"\""}], "Possible Issues": [{"in": "kernelAPI[<|\"key\" -> \"wrong\", \"code\" -> \"1 + 1\"|>]", "out": "Failure[\"Forbidden\", <|\"Message\" -> \"bad key\"|>]"}, {"in": "kernelAPI[<|\"key\" -> \"demo-secret\", \"mode\" -> \"chat\", \"payload_b64\" -> b64s[\"{}\"]|>]", "out": "<|\"error\" -> \"no chat key stored\", \"status\" -> 503|>"}]}, "see": ["b64s", "fromB64", "chatCall"], "source": "(* Step 1, once, in a signed-in Wolfram Cloud session: store the chat key privately *)\nCloudPut[\"PASTE-THE-CHAT-API-KEY-HERE\", \"LaplacianLab/apikey\", Permissions -> \"Private\"]\n\n(* Step 2: deploy; the same name keeps the URL *)\nWith[{keyObj = CloudObject[\"LaplacianLab/apikey\"], secret = \"CHOOSE-A-LONG-SECRET\"},\n CloudDeploy[\n  APIFunction[\n    {\"code\" -> \"String\" -> \"\", \"code_b64\" -> \"String\" -> \"\", \"key\" -> \"String\",\n     \"mode\" -> \"String\" -> \"wolfram\", \"payload_b64\" -> \"String\" -> \"\"},\n    Module[{b64s, fromB64, chatCall, chat, code},\n     b64s[s_String] := BaseEncode[StringToByteArray[s]];\n     fromB64[b_String] := Quiet@Check[ByteArrayToString[BaseDecode[b]], \"\"];\n     chatCall[payload_String, apiKey_String] := Module[{p, model, resp, body, status},\n       p = Quiet@Check[ImportByteArray[StringToByteArray[payload], \"RawJSON\"], $Failed];\n       If[! AssociationQ[p] || ! ListQ[p[\"messages\"]], Return[<|\"error\" -> \"bad payload\", \"status\" -> 400|>]];\n       model = Replace[p[\"model\"], Except[_String?(StringStartsQ[\"claude-\"])] -> \"claude-sonnet-5-5\"];\n       resp = URLRead[HTTPRequest[\"https://api.anthropic.com/v1/messages\", <|\"Method\" -> \"POST\",\n           \"Headers\" -> {\"x-api-key\" -> apiKey, \"anthropic-version\" -> \"2023-06-01\", \"content-type\" -> \"application/json\"},\n           \"Body\" -> ExportByteArray[DeleteMissing@<|\"model\" -> model,\n               \"max_tokens\" -> Clip[Replace[p[\"max_tokens\"], Except[_Integer] -> 1500], {1, 4096}],\n               \"system\" -> p[\"system\"], \"messages\" -> p[\"messages\"]|>, \"RawJSON\", \"Compact\" -> True]|>],\n         TimeConstraint -> 110];\n       If[FailureQ[resp], Return[<|\"error\" -> \"chat service unreachable\", \"status\" -> 502|>]];\n       status = resp[\"StatusCode\"];\n       body = Quiet@Check[ImportByteArray[resp[\"BodyByteArray\"], \"RawJSON\"], <||>];\n       If[status === 200 && AssociationQ[body],\n        <|\"text_b64\" -> b64s@StringJoin[Cases[Lookup[body, \"content\", {}],\n             KeyValuePattern[{\"type\" -> \"text\", \"text\" -> t_String}] :> t]],\n          \"stop_reason\" -> Lookup[body, \"stop_reason\", \"\"]|>,\n        <|\"error\" -> If[AssociationQ[body], Lookup[Lookup[body, \"error\", <||>], \"message\", \"chat request failed\"], \"chat request failed\"],\n          \"status\" -> status|>]];\n     chat = Quiet@Check[CloudGet[keyObj], \"\"];\n     chat = If[StringQ[chat], StringTrim[chat], \"\"];\n     Which[\n      #key =!= secret,\n       Failure[\"Forbidden\", <|\"Message\" -> \"bad key\"|>],\n      #mode === \"chat\",\n       If[chat === \"\", <|\"error\" -> \"no chat key stored\", \"status\" -> 503|>,\n        chatCall[fromB64[#[\"payload_b64\"]], chat]],\n      True,\n       code = If[#[\"code_b64\"] =!= \"\", fromB64[#[\"code_b64\"]], #code];\n       Module[{r = TimeConstrained[ToExpression[code], 60, $Aborted], img, txt},\n        img = If[FreeQ[r, _Graphics | _Graphics3D | _Image | _Legended], \"\",\n          BaseEncode[ExportByteArray[Rasterize[r, ImageResolution -> 110], \"PNG\"]]];\n        txt = ToString[r /. g : (_Graphics | _Graphics3D | _Image | _Legended) :> \"-Graphics-\", InputForm];\n        <|\"text\" -> txt, \"text_b64\" -> b64s[txt], \"image\" -> img, \"chat_ready\" -> chat =!= \"\"|>]\n      ]] &,\n    \"JSON\"],\n  \"LaplacianLabKernel\", Permissions -> \"Public\"]]", "hand": ["The request carries the right key and plain code, so the kernel evaluates Expand[(x + y)³] = x³ + 3x²y + 3xy² + y³.", "text_b64 is the base64 of those ASCII bytes; no graphics, so image is \"\"; no chat key is stored, so chat_ready is False — Out[1].", "A wrong key stops at the first Which test: Failure[\"Forbidden\"] — Out[4]. Chat mode with no stored key returns status 503 — Out[5]."]}, "b64s": {"name": "b64s", "slug": "b64s", "guide": "kernel", "defined": "LaplacianLabKernel (local helper)", "kind": "Function", "usage": [["b64s[s]", "gives the base64 encoding of the UTF-8 bytes of the string s."]], "details": ["The page decodes with atob and TextDecoder, which gives back the same characters."], "examples": {"Basic Examples": [{"in": "b64s[\"Δf = 0\"]", "out": "\"zpRmID0gMA==\""}], "Properties & Relations": [{"in": "fromB64[b64s[\"𝜟⊗f, θ, ∂\"]]", "out": "\"𝜟⊗f, θ, ∂\""}]}, "see": ["fromB64", "LaplacianLabKernel"], "source": "b64s[s_String] := BaseEncode[StringToByteArray[s]];", "hand": ["UTF-8 of “Δf = 0”: Δ = CE 94, then 66 20 3D 20 30 — seven bytes.", "Groups of three bytes → four 6-bit digits: CE 94 66 → z p R m; 20 3D 20 → I D 0 g; 30 → M A, padded ==.", "“zpRmID0gMA==” — Out[1]."]}, "fromB64": {"name": "fromB64", "slug": "fromB64", "guide": "kernel", "defined": "LaplacianLabKernel (local helper)", "kind": "Function", "usage": [["fromB64[b]", "decodes the base64 string b to a UTF-8 string, or gives \"\" when b is not valid base64."]], "details": [], "examples": {"Basic Examples": [{"in": "fromB64[\"zpRmID0gMA==\"]", "out": "\"Δf = 0\""}], "Possible Issues": [{"in": "fromB64[\"not base64!\"]", "out": "\"\""}]}, "see": ["b64s", "LaplacianLabKernel"], "source": "fromB64[b_String] := Quiet@Check[ByteArrayToString[BaseDecode[b]], \"\"];", "hand": ["Reverse the digits of “zpRmID0gMA==”: z p R m I D 0 g M A → bytes CE 94 66 20 3D 20 30.", "Decoded as UTF-8: “Δf = 0” — Out[1]. Text that is not base64 fails inside Check and gives \"\" — Out[2]."]}, "chatCall": {"name": "chatCall", "slug": "chatCall", "guide": "kernel", "defined": "LaplacianLabKernel (local helper)", "kind": "Function", "usage": [["chatCall[payload, apiKey]", "sends the JSON string payload to the chat service with apiKey and gives <|\"text_b64\" -> …, \"stop_reason\" -> …|>, or <|\"error\" -> …, \"status\" -> …|>."]], "details": ["payload must be a JSON object with a messages list; model must start with claude- (otherwise claude-sonnet-5-5 is used), and max_tokens is clipped to 1–4096 (default 1500).", "Only the text blocks of the reply are kept."], "examples": {"Basic Examples": [{"in": "chatCall[\"{\\\"model\\\": \\\"claude-sonnet-5-5\\\"}\", \"unused\"]", "out": "<|\"error\" -> \"bad payload\", \"status\" -> 400|>"}], "Possible Issues": [{"in": "chatCall[\"not json\", \"unused\"]", "out": "<|\"error\" -> \"bad payload\", \"status\" -> 400|>"}]}, "see": ["LaplacianLabKernel", "b64s"], "source": "chatCall[payload_String, apiKey_String] := Module[{p, model, resp, body, status},\n  p = Quiet@Check[ImportByteArray[StringToByteArray[payload], \"RawJSON\"], $Failed];\n  If[! AssociationQ[p] || ! ListQ[p[\"messages\"]], Return[<|\"error\" -> \"bad payload\", \"status\" -> 400|>]];\n  model = Replace[p[\"model\"], Except[_String?(StringStartsQ[\"claude-\"])] -> \"claude-sonnet-5-5\"];\n  resp = URLRead[HTTPRequest[\"https://api.anthropic.com/v1/messages\", <|\"Method\" -> \"POST\",\n      \"Headers\" -> {\"x-api-key\" -> apiKey, \"anthropic-version\" -> \"2023-06-01\", \"content-type\" -> \"application/json\"},\n      \"Body\" -> ExportByteArray[DeleteMissing@<|\"model\" -> model,\n          \"max_tokens\" -> Clip[Replace[p[\"max_tokens\"], Except[_Integer] -> 1500], {1, 4096}],\n          \"system\" -> p[\"system\"], \"messages\" -> p[\"messages\"]|>, \"RawJSON\", \"Compact\" -> True]|>],\n    TimeConstraint -> 110];\n  If[FailureQ[resp], Return[<|\"error\" -> \"chat service unreachable\", \"status\" -> 502|>]];\n  status = resp[\"StatusCode\"];\n  body = Quiet@Check[ImportByteArray[resp[\"BodyByteArray\"], \"RawJSON\"], <||>];\n  If[status === 200 && AssociationQ[body],\n   <|\"text_b64\" -> b64s@StringJoin[Cases[Lookup[body, \"content\", {}],\n        KeyValuePattern[{\"type\" -> \"text\", \"text\" -> t_String}] :> t]],\n     \"stop_reason\" -> Lookup[body, \"stop_reason\", \"\"]|>,\n   <|\"error\" -> If[AssociationQ[body], Lookup[Lookup[body, \"error\", <||>], \"message\", \"chat request failed\"], \"chat request failed\"],\n     \"status\" -> status|>]];", "hand": ["The payload {\"model\": \"claude-sonnet-5-5\"} is valid JSON but has no messages list.", "The first test fails before any network request, so the reply is <|\"error\" → \"bad payload\", \"status\" → 400|> — Out[1]."]}}, "brand": "CCN"}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const P = D.pages, NAMES = Object.keys(P);
const bySlug = {}; NAMES.forEach(n => bySlug[P[n].slug] = n);
const G = {}; D.guides.forEach(g => G[g.id] = g);
document.getElementById('brandname').textContent = D.brand;
document.getElementById('lablink').href = D.lab; document.getElementById('repolink').href = D.repo;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(code, self) {
  // tokenise: comments, strings, our names, numbers
  let out = '', i = 0;
  const re = /\(\*[\s\S]*?\*\)|"(?:[^"\\]|\\.)*"|[\p{L}$][\p{L}\p{N}$]*|\d+\.?\d*(?:\*\^-?\d+)?/gu;
  let m;

function ref(name) {

function index() {

/* CCN: a drawn horizontal slider under anything that scrolls sideways (works in every browser, incl. Firefox overlay scrollbars) */
(function () {

// search
const q = document.getElementById('q'), R = document.getElementById('results'); let sel = 0, hits = [];

  const s = q.value.trim().toLowerCase(); if (!s) { R.style.display = 'none'; return; }
  hits = NAMES.map(n => { const ln = n.toLowerCase(), sl = P[n].slug.toLowerCase(); let sc = ln === s || sl === s ? 0 : ln.startsWith(s) || sl.startsWith(s) ? 1 : ln.includes(s) || sl.includes(s) ? 2 : (P[n].usage.map(u => u[1]).join(' ') + ' ' + P[n].details.join(' ')).toLowerCase().includes(s) ? 3 : 9; return [sc, n]; })
